version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - node scripts/amplify-env.mjs
        - pnpm build
  artifacts:
    baseDirectory: .next
    files: ['**/*']
  cache:
    paths: ['node_modules/**/*', '.next/cache/**/*']
